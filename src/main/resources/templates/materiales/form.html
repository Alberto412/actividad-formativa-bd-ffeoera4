<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Material</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <h2 th:text="${titulo}">Material</h2>
    <form th:action="@{${accion}}" th:object="${material}" method="post" class="row g-3 mt-1">
        <div class="col-md-6">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Descripción</label>
            <input type="text" class="form-control" th:field="*{descripcion}">
        </div>
        <div class="col-md-6">
            <label class="form-label">Precio unitario</label>
            <input type="number" class="form-control" th:field="*{precioUnitario}" step="0.01" min="0" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Stock</label>
            <input type="number" class="form-control" th:field="*{stock}" min="0" required>
        </div>
        <div class="col-12">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a class="btn btn-secondary" th:href="@{/materiales}">Volver</a>
        </div>
    </form>
</div>
</body>
</html>
