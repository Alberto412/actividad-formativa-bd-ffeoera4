<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuevo material usado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Gestión de Partes</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" th:href="@{/}">Inicio</a>
            <a class="nav-link text-white" th:href="@{/clientes}">Clientes</a>
            <a class="nav-link text-white" th:href="@{/tecnicos}">Técnicos</a>
            <a class="nav-link text-white" th:href="@{/materiales}">Materiales</a>
            <a class="nav-link text-white" th:href="@{/partes}">Partes</a>
            <a class="nav-link text-white" th:href="@{/parte-materiales}">Materiales usados</a>
            <a class="nav-link text-white" th:href="@{/bd}">Base de datos</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h2 class="h4 mb-0">Nuevo material usado</h2>
        </div>
        <div class="card-body">
            <form th:action="@{${accion}}" th:object="${parteMaterial}" method="post" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Parte de trabajo</label>
                    <select class="form-select" th:field="*{parteTrabajo.id}" required>
                        <option value="">Selecciona un parte</option>
                        <option th:each="p : ${partes}" th:value="${p.id}" th:text="${p.id + ' - ' + p.titulo}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Material</label>
                    <select class="form-select" th:field="*{material.id}" required>
                        <option value="">Selecciona un material</option>
                        <option th:each="m : ${materiales}" th:value="${m.id}" th:text="${m.nombre}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Cantidad</label>
                    <input type="number" class="form-control" th:field="*{cantidad}" min="1" required>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Guardar</button>
                    <a class="btn btn-secondary" th:href="@{/parte-materiales}">Volver al listado</a>
                    <a class="btn btn-outline-secondary" th:href="@{/}">Volver al menú</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
