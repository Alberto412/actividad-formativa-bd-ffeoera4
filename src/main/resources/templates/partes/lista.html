<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Partes de trabajo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Partes de Trabajo</a>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Partes de trabajo</h2>
        <a class="btn btn-success" th:href="@{/partes/nuevo}">Crear parte</a>
    </div>
    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Fecha</th>
            <th>Horas</th>
            <th>Estado</th>
            <th>Cliente</th>
            <th>Técnico</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${partes}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.titulo}"></td>
            <td th:text="${p.fecha}"></td>
            <td th:text="${p.horasTrabajadas}"></td>
            <td th:text="${p.estado}"></td>
            <td th:text="${p.cliente != null ? p.cliente.nombre : ''}"></td>
            <td th:text="${p.tecnico != null ? p.tecnico.nombre : ''}"></td>
            <td>
                <a class="btn btn-sm btn-warning" th:href="@{'/partes/editar/' + ${p.id}}">Editar</a>
                <a class="btn btn-sm btn-danger" th:href="@{'/partes/eliminar/' + ${p.id}}">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
