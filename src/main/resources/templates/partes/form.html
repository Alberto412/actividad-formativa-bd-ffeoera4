<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Parte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <h2 th:text="${titulo}">Parte de trabajo</h2>
    <form th:action="@{${accion}}" th:object="${parte}" method="post" class="row g-3 mt-1">
        <div class="col-md-6">
            <label class="form-label">Título</label>
            <input type="text" class="form-control" th:field="*{titulo}" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Fecha</label>
            <input type="date" class="form-control" th:field="*{fecha}" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Horas trabajadas</label>
            <input type="number" class="form-control" th:field="*{horasTrabajadas}" step="0.1" min="0" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Estado</label>
            <input type="text" class="form-control" th:field="*{estado}" required>
        </div>
        <div class="col-12">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" th:field="*{descripcion}" rows="3"></textarea>
        </div>
        <div class="col-md-6">
            <label class="form-label">Cliente</label>
            <select class="form-select" th:field="*{cliente.id}" required>
                <option value="">Selecciona un cliente</option>
                <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombre + ' (' + c.empresa + ')'}"></option>
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Técnico</label>
            <select class="form-select" th:field="*{tecnico.id}" required>
                <option value="">Selecciona un técnico</option>
                <option th:each="t : ${tecnicos}" th:value="${t.id}" th:text="${t.nombre + ' - ' + t.especialidad}"></option>
            </select>
        </div>
        <div class="col-12">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a class="btn btn-secondary" th:href="@{/partes}">Volver</a>
        </div>
    </form>
</div>
</body>
</html>
