<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Parte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Gestión de Partes</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" th:href="@{/}">Inicio</a>
            <a class="nav-link text-white" th:href="@{/clientes}">Clientes</a>
            <a class="nav-link text-white" th:href="@{/tecnicos}">Técnicos</a>
            <a class="nav-link text-white" th:href="@{/materiales}">Materiales</a>
            <a class="nav-link text-white" th:href="@{/partes}">Partes</a>
            <a class="nav-link text-white" th:href="@{/parte-materiales}">Materiales usados</a>
            <a class="nav-link text-white" th:href="@{/bd}">Base de datos</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h2 class="h4 mb-0" th:text="${titulo}">Parte de trabajo</h2>
        </div>
        <div class="card-body">
            <form th:action="@{${accion}}" th:object="${parte}" method="post" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Título</label>
                    <input type="text" class="form-control" th:field="*{titulo}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Fecha</label>
                    <input type="date" class="form-control" th:field="*{fecha}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Horas trabajadas</label>
                    <input type="number" class="form-control" th:field="*{horasTrabajadas}" step="0.1" min="0" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Estado</label>
                    <input type="text" class="form-control" th:field="*{estado}" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Descripción</label>
                    <textarea class="form-control" th:field="*{descripcion}" rows="3"></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Cliente</label>
                    <select class="form-select" th:field="*{cliente.id}" required>
                        <option value="">Selecciona un cliente</option>
                        <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombre + ' (' + c.empresa + ')'}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Técnico</label>
                    <select class="form-select" th:field="*{tecnico.id}" required>
                        <option value="">Selecciona un técnico</option>
                        <option th:each="t : ${tecnicos}" th:value="${t.id}" th:text="${t.nombre + ' - ' + t.especialidad}"></option>
                    </select>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Guardar</button>
                    <a class="btn btn-secondary" th:href="@{/partes}">Volver al listado</a>
                    <a class="btn btn-outline-secondary" th:href="@{/}">Volver al menú</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
