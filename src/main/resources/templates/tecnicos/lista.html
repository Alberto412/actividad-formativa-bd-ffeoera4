<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Técnicos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Partes de Trabajo</a>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Técnicos</h2>
        <a class="btn btn-success" th:href="@{/tecnicos/nuevo}">Crear técnico</a>
    </div>
    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Especialidad</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${tecnicos}">
            <td th:text="${t.id}"></td>
            <td th:text="${t.nombre}"></td>
            <td th:text="${t.email}"></td>
            <td th:text="${t.especialidad}"></td>
            <td>
                <a class="btn btn-sm btn-warning" th:href="@{'/tecnicos/editar/' + ${t.id}}">Editar</a>
                <a class="btn btn-sm btn-danger" th:href="@{'/tecnicos/eliminar/' + ${t.id}}">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
