<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Técnicos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Gestión de Partes</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" th:href="@{/}">Inicio</a>
            <a class="nav-link text-white" th:href="@{/clientes}">Clientes</a>
            <a class="nav-link text-white" th:href="@{/tecnicos}">Técnicos</a>
            <a class="nav-link text-white" th:href="@{/materiales}">Materiales</a>
            <a class="nav-link text-white" th:href="@{/partes}">Partes</a>
            <a class="nav-link text-white" th:href="@{/parte-materiales}">Materiales usados</a>
            <a class="nav-link text-white" th:href="@{/bd}">Base de datos</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h2 class="h4 mb-0">Listado de Técnicos</h2>
            <div class="d-flex gap-2">
                <a class="btn btn-secondary" th:href="@{/}">Volver al menú</a>
                <a class="btn btn-success" th:href="@{/tecnicos/nuevo}">Crear técnico</a>
            </div>
        </div>
        <div class="card-body">
            <table class="table table-striped table-hover table-bordered mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Especialidad</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${tecnicos}">
                    <td th:text="${t.id}"></td>
                    <td th:text="${t.nombre}"></td>
                    <td th:text="${t.email}"></td>
                    <td th:text="${t.especialidad}"></td>
                    <td>
                        <a class="btn btn-sm btn-warning" th:href="@{'/tecnicos/editar/' + ${t.id}}">Editar</a>
                        <a class="btn btn-sm btn-danger" th:href="@{'/tecnicos/eliminar/' + ${t.id}}">Eliminar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
